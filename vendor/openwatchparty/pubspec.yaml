name: openwatchparty
description: >-
  Open Watch Party client SDK for Dart and Flutter. Join a watch party room by its code and keep your own player in
  sync with everyone else in it.
version: 1.1.0
homepage: https://openwatch.party
repository: https://github.com/edde746/openwatchparty/tree/main/sdk/dart
issue_tracker: https://github.com/edde746/openwatchparty/issues
topics:
  - watch-party
  - sync
  - websocket
  - video

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  web: ">=0.5.0 <2.0.0"
  web_socket: ^1.0.0

dev_dependencies:
  fake_async: ^1.3.1
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
