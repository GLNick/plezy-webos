name: plezy
description: "A beautiful Plex and Jellyfin client for Flutter"
publish_to: "none"
version: 2.23.0+153

environment:
  # Dart floor stays 3.12: freezed 3.x emits `final` constructor parameters,
  # which language 3.13 removed. Raise together with a freezed 4 migration.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.0
  cached_network_image_ce: any
  http: ^1.2.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  window_manager: ^0.5.1
  logger: any
  package_info_plus: any
  device_info_plus: any
  provider: ^6.1.2
  flex_color_picker: any
  qr_flutter: ^4.1.0
  slang:
    path: ../vendor/slang/slang
  slang_flutter:
    path: ../vendor/slang/slang_flutter
  duration: any
  connectivity_plus:
    path: ../vendor/plus_plugins/packages/connectivity_plus/connectivity_plus
  os_media_controls:
    path: ../vendor/media_controls
  rate_limiter: ^1.0.0
  wakelock_plus:
    path: packages/wakelock_plus
  path_provider: ^2.1.0
  path: ^1.9.0
  universal_gamepad: any
  drift: any
  crypto: any
  cryptography: any
  file_picker: any
  saf_util:
    # Vendored 3.1.0: fixes upstream's duplicate MethodChannel result.
    path: packages/saf_util
  saf_stream: any
  material_symbols_icons: any
  web_socket_channel: any
  # 1.2.1: Windows IPC no longer blocks the UI isolate while Discord stalls (#2518).
  dart_discord_presence: any
  flutter_svg: any
  # Fork 54a34a0 fixes upstream #649's missing desktop temp parent; 7ee4588
  # survives a host with no documents directory (Linux without xdg-user-dirs);
  # 7f500a1 reads real macOS volume capacity and skips unknown capacity on
  # desktop; 06e385c counts each Android byte once, so progress and the resume
  # offset match the file; 09690d6 lets Wi-Fi-only tasks run over a VPN and on
  # Ethernet (upstream 9.6.1's Wi-Fi NetworkRequest kept NOT_VPN); 5d45882 makes
  # a resumed SAF download reuse its own partial document and deletes SAF
  # partials through the provider; ebdf69a resumes a download the system stops
  # (job quota, lost network) instead of reporting it canceled and deleting the
  # partial. Keep the same-filesystem move/resume cleanup; no per-host TLS bypass.
  background_downloader:
    path: ../vendor/background_downloader
  sentry_flutter: any
  auto_updater:
    path: ../vendor/auto_updater/packages/auto_updater
  win_http: any
  collection: ^1.18.0
  freezed_annotation: any
  xml: any
  string_similarity: ^2.2.0
  unorm_dart: ^0.3.2
  shared_preferences_webos:
    path: ../plugins/packages/shared_preferences
  path_provider_webos:
    path: ../plugins/packages/path_provider
  connectivity_plus_webos:
    path: ../plugins/packages/connectivity_plus
  device_info_plus_webos:
    path: ../plugins/packages/device_info_plus
  package_info_plus_webos:
    path: ../plugins/packages/package_info_plus
  url_launcher_webos:
    path: ../plugins/packages/url_launcher
  video_player_webos:
    path: ../plugins/packages/video_player
  webos_service_bridge:
    path: ../plugins/packages/webos_service_bridge

dev_dependencies:
  archive: any
  flutter_test:
    sdk: flutter
  flutter_lints: any
  # Root analysis includes packages/saf_util.
  # mgenware_dart_lints: ^8.0.0
  fake_async: ^1.3.3
  stream_channel: ^2.1.4
  # build_runner: any
  # json_serializable: any
  # slang_build_runner: any
  # Used by explicit check-unused CI steps; analyzer plugin disabled.
  # dart_code_linter: ^4.1.8
  # drift_dev: any
  shared_preferences_platform_interface: ^2.4.0
  path_provider_platform_interface: ^2.1.0
  connectivity_plus_platform_interface: ^2.1.0
  # Exercise vendored desktop preference stores against real file I/O,
  # including #1732 repair and atomic writes.
  shared_preferences_linux: ^2.4.1
  shared_preferences_windows: ^2.4.1
  path_provider_linux: ^2.2.1
  path_provider_windows: ^2.3.0
  plugin_platform_interface: ^2.1.0
  # freezed: any
  # analyzer: any

dependency_overrides:
  slang:
    path: ../vendor/slang/slang
  slang_flutter:
    path: ../vendor/slang/slang_flutter
  # background_downloader 9.6.2 requires hosted connectivity_plus; keep the
  # pinned git source for every consumer.
  connectivity_plus:
    path: ../vendor/plus_plugins/packages/connectivity_plus/connectivity_plus
  auto_updater_platform_interface:
    git:
      url: https://github.com/edde746/auto_updater
      ref: 9e150f7
      path: packages/auto_updater_platform_interface
  auto_updater_macos:
    git:
      url: https://github.com/edde746/auto_updater
      ref: 9e150f7
      path: packages/auto_updater_macos
  auto_updater_windows:
    git:
      url: https://github.com/edde746/auto_updater
      ref: 9e150f7
      path: packages/auto_updater_windows
  # Vendored 2.4.1: atomic replacement prevents upstream #1732 corruption.
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  shared_preferences_linux:
    path: packages/shared_preferences_linux
flutter:
  uses-material-design: true
  assets:
    - assets/plezy.png
    - assets/plezy_adaptive_foreground.svg
    - assets/plex_chevron.svg
    - assets/jellyfin_icon.svg
    - assets/emby_icon.svg
    - assets/trakt_circlemark.svg
    - assets/mal_mark.svg
    - assets/anilist_mark.svg
    - assets/simkl_mark.svg
    - assets/seerr_mark.svg
    - assets/mdblist_mark.svg
    - assets/go-noto-current-regular.ttf
    - assets/go-noto-kurrent-hangul.ttf
    - assets/shaders/nvscaler/
    - assets/shaders/artcnn/
    - assets/shaders/anime4k/
    - assets/player_icons/
    - assets/rating_icons/
  # Registered as UI font families so the Linux build, whose fontconfig may
  # lack CJK fonts, can fall back to the bundled subtitle fonts (mono_theme).
  fonts:
    - family: Go Noto Current
      fonts:
        - asset: assets/go-noto-current-regular.ttf
    - family: Go Noto Current Hangul
      fonts:
        - asset: assets/go-noto-kurrent-hangul.ttf
