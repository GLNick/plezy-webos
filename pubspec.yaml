name: plezy
description: "A beautiful Plex and Jellyfin client for Flutter"
publish_to: "none"
version: 2.22.0+152

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.4
  cached_network_image_ce: ^4.9.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  window_manager:
    path: packages/window_manager_mock
  logger: ^2.7.0
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  provider: ^6.1.2
  flex_color_picker: ^3.8.0
  qr_flutter: ^4.1.0
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  duration: ^4.0.3
  connectivity_plus:
    git:
      url: https://github.com/fluttercommunity/plus_plugins
      ref: bf04cdf66598dc3fca274b8b1db2b92b0bf6b73e
      path: packages/connectivity_plus/connectivity_plus
  os_media_controls:
    git:
      url: https://github.com/edde746/media_controls
      ref: a27208e641790029ac54d825b97508575caee1a7
  rate_limiter: ^1.0.0
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.0
  path: ^1.9.0
  universal_gamepad: ^1.5.7
  drift: ^2.31.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: ^11.0.2
  saf_util:
    path: packages/saf_util
  saf_stream: ^3.1.0
  material_symbols_icons: ^4.2951.0
  web_socket_channel: ^3.0.1
  flutter_svg: ^2.2.3
  background_downloader:
    git:
      url: https://github.com/edde746/background_downloader
      ref: 06e385cb8d69893a8c5c9ceaa369ebdd22ce88a3
  sentry_flutter: ^9.30.0
  collection: ^1.18.0
  freezed_annotation: ^3.1.0
  xml: ^7.0.1
  string_similarity: ^2.2.0
  unorm_dart: ^0.3.2
  web: ^1.1.1

dev_dependencies:
  archive: ^4.0.9
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mgenware_dart_lints: ^8.0.0
  fake_async: ^1.3.3
  stream_channel: ^2.1.4
  build_runner: ^2.13.0
  json_serializable: ^6.7.1
  slang_build_runner: ^4.14.0
  drift_dev: ^2.28.3
  shared_preferences_platform_interface: ^2.4.0
  path_provider_platform_interface: ^2.1.0
  connectivity_plus_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
  freezed: ^3.2.5
  analyzer: 10.2.0

dependency_overrides:
  sqlite3:
    path: packages/sqlite3_mock
  connectivity_plus:
    git:
      url: https://github.com/fluttercommunity/plus_plugins
      ref: bf04cdf66598dc3fca274b8b1db2b92b0bf6b73e
      path: packages/connectivity_plus/connectivity_plus

flutter:
  uses-material-design: true
  assets:
    - assets/plezy.png
    - assets/plezy_adaptive_foreground.svg
    - assets/plex_chevron.svg
    - assets/jellyfin_icon.svg
    - assets/emby_icon.svg
    - assets/trakt_circlemark.svg
    - assets/mal_mark.svg
    - assets/anilist_mark.svg
    - assets/simkl_mark.svg
    - assets/seerr_mark.svg
    - assets/mdblist_mark.svg
    - assets/go-noto-current-regular.ttf
    - assets/go-noto-kurrent-hangul.ttf
    - assets/shaders/nvscaler/
    - assets/shaders/artcnn/
    - assets/shaders/anime4k/
    - assets/player_icons/
    - assets/rating_icons/
  fonts:
    - family: Go Noto Current
      fonts:
        - asset: assets/go-noto-current-regular.ttf
    - family: Go Noto Current Hangul
      fonts:
        - asset: assets/go-noto-kurrent-hangul.ttf