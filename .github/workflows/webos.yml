name: webOS IPKs

on:
  push:
    branches:
      - webos-native-working
    tags:
      - 'v*-webos*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain
        run: scripts/webos/ci/setup-toolchain.sh

      - name: Build IPKs
        run: scripts/webos/ci/build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webos-ipks
          path: dist/*.ipk
          if-no-files-found: error

      - name: Publish release with Homebrew Channel repositories
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/webos/ci/publish.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
